<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Shuriken Neo 🎯⚔️</title>
  <meta name="description" content="Hypnotic timing & target blade throwing game. Stick all neon shurikens into the spinning cyber core without colliding!">
  <script src="arcade-leaderboard.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; user-select: none; }
    body {
      background: #070914;
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 550px;
      background: radial-gradient(circle at 50% 40%, #121733 0%, #050610 100%);
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 245, 255, 0.15);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .arcade-nav {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 100;
      background: rgba(10, 14, 30, 0.85);
      border: 2px solid #00f5ff;
      color: #00f5ff;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      font-size: 13px;
      box-shadow: 0 0 15px rgba(0,245,255,0.3);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .arcade-nav:hover {
      background: #00f5ff;
      color: #000;
      box-shadow: 0 0 25px #00f5ff;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      font-family: monospace;
      font-size: 20px;
      font-weight: 700;
      color: #00f5ff;
      text-shadow: 0 0 10px #00f5ff;
      pointer-events: none;
      z-index: 50;
      line-height: 1.3;
    }
    .stage-badge {
      color: #ff007f;
      text-shadow: 0 0 10px #ff007f;
    }
    #modal {
      position: absolute;
      inset: 0;
      background: rgba(6, 8, 20, 0.88);
      backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 24px;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    #modal h1 {
      font-size: 34px;
      font-weight: 900;
      color: #ff007f;
      text-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
      margin-bottom: 12px;
    }
    .modal-stats {
      font-size: 18px;
      color: #c4d1eb;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .modal-stats span {
      color: #00f5ff;
      font-weight: 800;
      font-size: 22px;
    }
    .btn {
      background: linear-gradient(135deg, #00f5ff, #ff007f);
      border: none;
      color: #000;
      font-weight: 800;
      font-size: 16px;
      padding: 14px 32px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 245, 255, 0.4);
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 30px rgba(255, 0, 127, 0.5);
    }
    .aim-hint {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 1px;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
      z-index: 50;
      font-weight: 600;
    }
    @media (max-width: 600px) {
      .hud { font-size: 16px; }
      .arcade-nav { font-size: 11px; padding: 6px 12px; }
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <a href="https://marcuscaiado.github.io/marcus-arcade/" class="arcade-nav">🕹️ Arcade Hub</a>
    
    <div class="hud">
      <div class="stage-badge">STAGE <span id="stage-val">1</span></div>
      <div>SCORE: <span id="score-val">0</span></div>
    </div>

    <canvas id="gameCanvas" width="550" height="800"></canvas>

    <div class="aim-hint">TAP SCREEN / SPACE TO THROW BLADE</div>

    <div id="modal">
      <h1>BLADE DEFLECTED! 💥</h1>
      <div class="modal-stats">
        FINAL SCORE: <span id="final-score">0</span><br>
        HIGHEST STAGE: <span id="best-stage">0</span>
      </div>
      <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
        <button class="btn" onclick="restartGame()">RETRY STAGE 🔄</button>
        <a href="https://marcuscaiado.github.io/marcus-arcade/" class="btn" style="background:#151833; color:#00f5ff; border:1px solid #00f5ff;">ARCADE HUB 🕹️</a>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ==========================================
    // PROCEDURAL AUDIO SYNTH
    // ==========================================
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playStickSound() {
      try {
        const c = getAudio();
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, c.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, c.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start();
        osc.stop(c.currentTime + 0.1);
      } catch(e) {}
    }

    function playShatterSound() {
      try {
        const c = getAudio();
        const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        freqs.forEach((f, i) => {
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, c.currentTime + i * 0.04);
          gain.gain.setValueAtTime(0.18, c.currentTime + i * 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + i * 0.04 + 0.3);
          osc.connect(gain);
          gain.connect(c.destination);
          osc.start(c.currentTime + i * 0.04);
          osc.stop(c.currentTime + i * 0.04 + 0.3);
        });
      } catch(e) {}
    }

    function playDeflectSound() {
      try {
        const c = getAudio();
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, c.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, c.currentTime + 0.35);
        gain.gain.setValueAtTime(0.25, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start();
        osc.stop(c.currentTime + 0.35);
      } catch(e) {}
    }

    // ==========================================
    // GAME STATE
    // ==========================================
    let currentStage = 1;
    let score = 0;
    let bestStage = parseInt(localStorage.getItem('cyber_shuriken_best') || '1', 10);
    let isGameOver = false;

    // Core Orb
    const core = {
      x: 275,
      y: 280,
      r: 68,
      rotation: 0,
      rotSpeed: 0.028,
      pulse: 0,
      color: '#00f5ff'
    };

    // Knives stuck in the core (angle relative to core)
    let stuckKnives = [];

    // Flying Knife
    let flyingKnife = null;

    // Available knives to throw in current level
    let bladesTotal = 7;
    let bladesRemaining = 7;

    // Particle FX & Screen Shake
    let particles = [];
    let screenShake = 0;

    function initStage(stageNum) {
      currentStage = stageNum;
      document.getElementById('stage-val').textContent = currentStage;

      const isBoss = stageNum % 4 === 0;
      const palette = ['#00f5ff', '#ff007f', '#ffd32a', '#05ffa1', '#b967ff'];
      core.color = isBoss ? '#ff007f' : palette[(stageNum - 1) % palette.length];
      
      // Dynamic rotation modes: Steady, Oscillating, Pulse
      core.baseRotSpeed = 0.022 + Math.min(0.014, stageNum * 0.0018);
      core.rotMode = stageNum % 3; // 0: Steady, 1: Pendulum Wave, 2: Pulse Speed
      core.rotSpeed = core.baseRotSpeed;

      bladesTotal = 6 + Math.min(Math.floor(stageNum / 2), 5);
      bladesRemaining = bladesTotal;
      stuckKnives = [];
      flyingKnife = null;

      // Pre-populate fair starter blades on higher levels
      const preCount = Math.min(Math.floor((stageNum - 1) / 3), 3);
      for (let i = 0; i < preCount; i++) {
        stuckKnives.push({
          angle: (i / preCount) * Math.PI * 2,
          length: 55
        });
      }
    }

    function throwBlade() {
      if (isGameOver || flyingKnife || bladesRemaining <= 0) return;
      getAudio();

      flyingKnife = {
        x: 275,
        y: 660,
        vy: -24,
        length: 55
      };

      bladesRemaining--;
    }

    function spawnShatterParticles(cx, cy, color, count = 30) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 8;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          rot: Math.random() * Math.PI,
          rotSpeed: (Math.random() - 0.5) * 0.2,
          size: 4 + Math.random() * 6,
          color: color,
          alpha: 1
        });
      }
    }

    function triggerDeflect(x, y) {
      isGameOver = true;
      playDeflectSound();
      screenShake = 16;
      spawnShatterParticles(x, y, '#ff0055', 25);

      bestStage = Math.max(bestStage, currentStage);
      localStorage.setItem('cyber_shuriken_best', bestStage);
      document.getElementById('final-score').textContent = score;
      document.getElementById('best-stage').textContent = bestStage;
      document.getElementById('modal').style.display = 'flex';

      try {
        if (window.ArcadeLeaderboard) {
          window.ArcadeLeaderboard.submitScore('cyber-shuriken', score);
        }
      } catch(e){}
    }

    function restartGame() {
      score = 0;
      isGameOver = false;
      document.getElementById('score-val').textContent = '0';
      document.getElementById('modal').style.display = 'none';
      initStage(1);
    }

    // ==========================================
    // INPUT HANDLERS
    // ==========================================
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.arcade-nav, #modal, button')) return;
      throwBlade();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        throwBlade();
      }
    });

    // ==========================================
    // GAME LOOP
    // ==========================================
    function loop() {
      ctx.save();

      // Screen Shake
      if (screenShake > 0) {
        const sx = (Math.random() - 0.5) * screenShake;
        const sy = (Math.random() - 0.5) * screenShake;
        ctx.translate(sx, sy);
        screenShake = Math.max(0, screenShake - 1);
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Rotate Core with Dynamic Procedural Modes
      if (!isGameOver) {
        if (core.rotMode === 1) {
          // Smooth sinusoidal pendulum oscillation
          core.rotation += Math.sin(Date.now() * 0.002) * core.baseRotSpeed * 1.5;
        } else if (core.rotMode === 2) {
          // Rhythm pulse acceleration
          const pulseSpd = core.baseRotSpeed * (1 + Math.cos(Date.now() * 0.003) * 0.4);
          core.rotation += pulseSpd;
        } else {
          core.rotation += core.baseRotSpeed;
        }
      }
      core.pulse = Math.max(0, core.pulse - 0.05);

      // Draw Rotating Core Orb
      ctx.save();
      ctx.translate(core.x, core.y);

      // Outer Glow
      ctx.beginPath();
      ctx.arc(0, 0, core.r + core.pulse * 8, 0, Math.PI * 2);
      ctx.shadowColor = core.color;
      ctx.shadowBlur = 24;
      ctx.fillStyle = 'rgba(10, 16, 40, 0.95)';
      ctx.strokeStyle = core.color;
      ctx.lineWidth = 4;
      ctx.fill();
      ctx.stroke();

      // Core Geometric Circuit lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const a = core.rotation + (i * Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * (core.r - 8), Math.sin(a) * (core.r - 8));
        ctx.stroke();
      }

      // Core Stage Number
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = core.color;
      ctx.shadowBlur = 10;
      ctx.fillText(currentStage, 0, 0);

      // Draw Stuck Knives rotating with core
      for (const k of stuckKnives) {
        ctx.save();
        ctx.rotate(core.rotation + k.angle);

        // Cyber blade drawing
        ctx.shadowColor = '#00f5ff';
        ctx.shadowBlur = 14;
        ctx.strokeStyle = '#00f5ff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, core.r);
        ctx.lineTo(0, core.r + k.length);
        ctx.stroke();

        // Blade Tip & Hilt
        ctx.fillStyle = '#ff007f';
        ctx.beginPath();
        ctx.arc(0, core.r + k.length, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      ctx.restore();

      // Update & Draw Flying Knife
      if (flyingKnife && !isGameOver) {
        flyingKnife.y += flyingKnife.vy;

        // Check if reaches the core radius
        const targetContactY = core.y + core.r;
        if (flyingKnife.y <= targetContactY) {
          // Calculate angle relative to current core rotation
          const contactAngle = (Math.PI / 2) - core.rotation;

          // Normalize angle into [-PI, PI]
          let normContact = contactAngle % (Math.PI * 2);
          if (normContact < 0) normContact += Math.PI * 2;

          // Check Collision with existing stuck blades (Fair 0.22 margin)
          let hitOther = false;
          const TOLERANCE_ANGLE = 0.22;

          for (const k of stuckKnives) {
            let normK = k.angle % (Math.PI * 2);
            if (normK < 0) normK += Math.PI * 2;

            let diff = Math.abs(normContact - normK);
            if (diff > Math.PI) diff = Math.PI * 2 - diff;

            if (diff < TOLERANCE_ANGLE) {
              hitOther = true;
              break;
            }
          }

          if (hitOther) {
            if (window.DopamineSynth) window.DopamineSynth.playThud(0.35);
            triggerDeflect(flyingKnife.x, targetContactY);
            flyingKnife = null;
          } else {
            // Blade successfully stuck!
            stuckKnives.push({
              angle: contactAngle,
              length: 55
            });
            if (window.DopamineSynth) {
              window.DopamineSynth.playCombo(stuckKnives.length);
            } else {
              playStickSound();
            }
            core.pulse = 1.2;
            score += 100;
            document.getElementById('score-val').textContent = score;
            if (window.DopamineJuice) {
              window.DopamineJuice.spawnScore(flyingKnife.x, targetContactY, '+100 🎯', stuckKnives.length);
            }
            spawnShatterParticles(flyingKnife.x, targetContactY, '#00f5ff', 8);
            flyingKnife = null;

            // Check if level completed
            if (bladesRemaining === 0) {
              if (window.DopamineSynth) {
                window.DopamineSynth.playWin();
              } else {
                playShatterSound();
              }
              if (window.DopamineJuice) {
                window.DopamineJuice.explodeConfetti(core.x, core.y, 50);
              }
              screenShake = 12;
              spawnShatterParticles(core.x, core.y, core.color, 45);
              setTimeout(() => {
                initStage(currentStage + 1);
              }, 400);
            }
          }
        }
      }

      // Draw Flying Knife (or waiting knife at bottom)
      const knifeDrawY = flyingKnife ? flyingKnife.y : 660;
      ctx.save();
      ctx.shadowColor = '#00f5ff';
      ctx.shadowBlur = 15;
      ctx.strokeStyle = '#00f5ff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(275, knifeDrawY);
      ctx.lineTo(275, knifeDrawY + 55);
      ctx.stroke();

      ctx.fillStyle = '#ff007f';
      ctx.beginPath();
      ctx.arc(275, knifeDrawY + 55, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Draw Blade Inventory Counter Dots at bottom
      ctx.save();
      for (let i = 0; i < bladesTotal; i++) {
        const dotX = 275 - ((bladesTotal - 1) * 14) / 2 + i * 14;
        const dotY = 740;
        const isLeft = i < bladesRemaining;
        ctx.beginPath();
        ctx.arc(dotX, dotY, 4, 0, Math.PI * 2);
        ctx.fillStyle = isLeft ? '#00f5ff' : 'rgba(255, 255, 255, 0.15)';
        ctx.shadowColor = isLeft ? '#00f5ff' : 'transparent';
        ctx.shadowBlur = isLeft ? 8 : 0;
        ctx.fill();
      }
      ctx.restore();

      // Update & Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.rotSpeed;
        p.alpha -= 0.025;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    initStage(1);
    loop();
  </script>
</body>
</html>
